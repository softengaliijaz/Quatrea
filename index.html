<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Quatréa is a fictional perfume house with four fragrances, one for each season." />
    <meta name="theme-color" content="#f5f4f8" />
    <meta property="og:title" content="Quatréa — A year, bottled four ways" />
    <meta property="og:description" content="Four fragrances, one for each season. Scroll through the year." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <title>Quatréa — A year, bottled four ways</title>
    <script>
      try { var t = JSON.parse(localStorage.getItem('quatrea:theme')) || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); document.documentElement.dataset.theme = t; } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Quatréa needs JavaScript to run. Please enable it to explore the four seasons.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
